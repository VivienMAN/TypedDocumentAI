name: Feature request
description: Propose a focused document-processing improvement.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and example use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed API and alternatives
      description: For a new provider, link its official input, output and schema contracts.
