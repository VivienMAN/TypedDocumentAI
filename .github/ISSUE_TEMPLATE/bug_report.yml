name: Bug report
description: Report a reproducible defect without including sensitive documents.
title: '[Bug] '
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data. Remove API keys, personal data, full HTTP bodies and private URLs.
      render: csharp
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package version, .NET version, provider and model
    validations:
      required: true
