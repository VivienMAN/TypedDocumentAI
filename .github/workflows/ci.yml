name: CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Computed package version
        type: string
        default: '1.0.0'
      source_sha:
        description: Exact source commit to verify
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CI: 'true'
      PACKAGE_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore, build, offline tests and package validation
        run: python tools/verify.py --version "$env:PACKAGE_VERSION"
        shell: pwsh
      - name: Save reports and packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
